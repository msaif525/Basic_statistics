project:
  type: book

book:
  title: "Basic Statistics"
  author: "Mohammad Saifuddin"
  date: today
  downloads: [pdf, epub]
  repo-url: https://msaif525.github.io/Basic_statistics
  search: 
    location: sidebar
    type: textbox   
  sidebar:
    pinned: true
    tools:
      - icon: save
        menu:
          - text: ""
            url:  "#"
          - text: ""
            url:  "#"
          - text: ""
            url:  "#"
  chapters:
    - index.qmd
    - intro.qmd
    - central_tendency.qmd
    - quantiles.qmd
    - dispersion.qmd
    - shape.qmd
    - correlation.qmd
    - regression.qmd
    - probability.qmd
    - discrete_rv.qmd
    - continuous_rv.qmd
    - sqc.qmd
    - summary.qmd
    - references.qmd

execute: 
  echo: false
  warning: false

bibliography: references.bib

format:
  html:
    grid:
      margin-width: 300px
      body-width: 900px
      sidebar-width: 300px
      gutter-width: 1.5rem
    theme: cosmo
    code-fold: true
  pdf:
    documentclass: scrreprt
    include-in-header: footer.tex
    geometry:
      - top=20mm
      - bottom=25mm
      - left=25mm
      - right=25mm
      - heightrounded
    toc: true
    toc-depth: 2
    colorlinks: true
    fontsize: 11pt
    #include-before-body: cover.tex
  
css: styles.css
editor: visual